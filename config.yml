# =====================================================================
#  Every setting of a run. One line per key on purpose - what each one
#  means, and why it is that value, is written in docs/config.md.
#
#  One-off override, no editing:  python src/run.py --set world.size=32
# =====================================================================

# --- RUN ---
run:
  episode_length: 20      # steps per logging window; episodes are asked in the terminal
  deterministic: true     # ask torch for deterministic kernels (warn_only)

# --- AGENTS ---
agents:
  count: 4                # default offered by the terminal prompt
  view_size: 10           # window side; reaches view_size // 2 each way, so really 11x11

# --- WORLD ---
world:
  size: 64
  balance:                # share of the map each kind is generated at AND refilled to
    danger: 0.15          # red
    food: 0.15            # green
  refill:
    every: 5              # check the map every N steps

# --- LOGGING ---
# One folder per WORLD, not per process: logs/<world_id>[_<label>]/
logging:
  dir: "logs"
  flush_every_steps: 1000         # close a part of every table this often
  max_rows_per_part: 50000        # ...or when a table has this many rows
  world_snapshot_every: 100       # snapshot the map every N steps (0 = off)
  rng_world_every_episodes: 1     # map/movement/genome streams, per window
  rng_agents_every_episodes: 100  # the agents' own streams, per window
  archive_dir: "archives"         # where scripts/logs.py puts packed runs
  panel_dir: ".panel"             # the control panel's files; never inside dir

# --- CHECKPOINTS ---
# models_dir: one file per agent, an archive, never read back.
# dir: the whole run in one file, in rolling/ and pinned/.
checkpoints:
  models_dir: "models"
  dir: "checkpoints"
  every_steps: 500        # write a checkpoint every N steps (0 = off)
  replay_every: 5         # every Nth checkpoint also carries the buffers
  keep: 5                 # runs kept in rolling/; pinned ones are forever

# --- REWARD SHAPING ---
reward_shaping:
  food_bonus: 5           # added to the intrinsic reward on a step the world paid food

# --- ENERGY ---
# The world's reward IS energy: a food cell is +5 reward and +5 energy.
energy:
  energy_leak: 0.5        # base cost of a tick, before aging
  start_energy: 50        # what the first agents are born with
  max_energy: 300         # stomach ceiling: energy never goes above this
  reproduction_threshold: 100  # energy at which an agent makes a child
  reproduction_cost: 100   # what the parents pay, and what the child is born with

# --- LIFE ---
life:
  max_childhood_steps: 2500  # longest childhood; breeding ends it sooner
  death_energy: -20         # an adult at or below this energy dies
  aging:
    every: 200            # every N ticks of ADULT life (from the end of childhood)...
    amount: 0.05          # ...the personal leak grows by this much, forever

# --- GENOME ---
# Every value that changes HOW an agent learns, as a distribution the first
# agents are drawn from: mean (center), scale (stddev), type, step.
genome:
  type: clons             # reproduction species: clons | non_linear | mendel
  # Genes that vary and mutate. Any gene left out is frozen: every agent
  # carries exactly its mean, from the first one on, and passes it on as is.
  evolve:
    - alpha
    - sigma
    - learning_rate
    - max_norm
    - gamma
    - target_update_freq
    - hidden_size
    - hidden_layers
    - buffer_size
    - batch_size
    - min_buffer_size
    - epsilon
    - epsilon_decay
    - epsilon_min
    - curiosity_beta
    - curiosity_decay
  genes:
    # --- REPRODUCTION ---
    alpha:                        # non_linear: how far outside the parents a child may fall
      mean: 0.5
      scale: 0.5
      type: float
    sigma:                        # width of mutation, and the chance of a huge one
      mean: 0.005
      scale: 0.001
      type: float

    # --- OPTIMIZER ---
    learning_rate:                # Adam lr
      mean: 0.001
      scale: 0.0005
      type: float
    max_norm:                     # gradient clipping; decides the effective lr
      mean: 0.01
      scale: 0.005
      type: float

    # --- DQN TARGETS ---
    gamma:                        # discount factor
      mean: 0.99
      scale: 0.001
      type: float
    target_update_freq:           # updates between two target-net syncs
      mean: 1000
      scale: 200
      type: int

    # --- NETWORK SHAPE ---
    hidden_size:
      mean: 64
      scale: 8
      type: int
    hidden_layers:
      mean: 2
      scale: 0.5
      type: int

    # --- MEMORY --- (one transition per tick, so these are ticks of history)
    buffer_size:                  # how far back this mind remembers
      mean: 10000
      scale: 2000
      type: int
    batch_size:                   # how much it revisits per update
      mean: 32
      scale: 4
      type: int
    min_buffer_size:              # warmup before the first update
      mean: 500
      scale: 100
      type: int

    # --- EXPLORATION --- (per logging window, on the agent's own age)
    epsilon:                      # start value
      mean: 0.7
      scale: 0.1
      type: float
    epsilon_decay:
      mean: 0.995
      scale: 0.002
      type: float
    epsilon_min:                  # floor; too low and a shuttle at a wall never breaks
      mean: 0.05
      scale: 0.005
      type: float

    # --- CURIOSITY --- (intrinsic reward for novelty; visit counts last a whole life)
    curiosity_beta:               # strength, against a food cell worth +5
      mean: 1.0
      scale: 0.5
      type: float
    curiosity_decay:
      mean: 0.995
      scale: 0.002
      type: float
